# Đưa game lên GitHub Pages mỗi khi đẩy code lên nhánh main.
name: Deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Build
        # Kho nội dung nằm ở repo SnugLevelEditor
        env:
          VITE_CONTENT_URL: ${{ vars.CONTENT_URL || 'https://raw.githubusercontent.com/duybvsmartmove/SnugLevelEditor/main/content/' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
