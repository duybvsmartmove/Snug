<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Sinh sprite · Everything Fits</title>
  <style>
    body{font:14px/1.5 system-ui,sans-serif;margin:0;padding:20px;background:#14121A;color:#E8E3EE}
    h1{font-size:18px;margin:0 0 4px}
    p{margin:0 0 16px;color:#9E96AD}
    button{background:#2E9E6B;color:#fff;border:0;border-radius:8px;padding:9px 16px;font:700 14px system-ui;cursor:pointer}
    button:disabled{background:#555;cursor:default}
    #log{margin-top:16px;font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;max-height:60vh;overflow:auto;
         background:#0D0B12;border-radius:8px;padding:12px}
    #sheet{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px;background:#0D0B12;border-radius:8px;padding:12px}
    #sheet canvas{background:#241F2E;border-radius:4px}
    /* canvas của game: cần tồn tại vì art dùng chung ctx, nhưng không cần nhìn thấy */
    #game{position:fixed;left:-9999px;top:0;width:420px;height:760px}
  </style>
</head>
<body>
  <h1>Sinh sprite từ art vẽ bằng code</h1>
  <p>Vẽ từng món, từng bối cảnh, từng chiếc túi ra file PNG rồi ghi vào bản nháp.
     Chạy xong nhớ bấm <b>Phát hành</b> bên editor.</p>
  <button id="run">Sinh toàn bộ PNG</button>
  <div id="log"></div>
  <div id="sheet"></div>
  <canvas id="game"></canvas>
  <script type="module" src="./gen-sprites.js"></script>
</body>
</html>
