<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#EADFD6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Everything Fits</title>
  <link rel="icon" href="./public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles/main.css">
  <style>
    /* Tấm màn chuyển cảnh. Viết thẳng ở đây, không để trong file CSS ngoài: lúc mở app
       nó phải có mặt ngay khung hình đầu tiên, tức là trước khi file CSS kia kịp về.
       Cùng một tấm này lo cả ba việc — che lúc khởi động, che lúc vào màn chơi, che lúc
       về trang chủ — nên không bao giờ gỡ khỏi trang, chỉ mờ đi.
       Hai tốc độ khác nhau là cố ý: KÉO VÀO nhanh cho dứt khoát, MỞ RA chậm hơn cho êm. */
    #veil{
      position:fixed;inset:0;z-index:99;display:grid;place-items:center;
      background:radial-gradient(120% 70% at 50% 0%, #FFF6EA 0%, #F3E3D2 46%, #E7CDB6 100%);
      opacity:1;transition:opacity .19s ease;
    }
    #veil.off{opacity:0;pointer-events:none;transition:opacity .3s ease}
    /* Chữ hiệu chỉ hiện lần mở app. Nhá nó ra mỗi lần đổi màn thì thành phiền.
       Hiệu ứng nhấp nháy phải nằm TRONG nhánh .boot, không để ở nhánh chung: keyframe
       đè lên mọi khai báo opacity thường, nên để ngoài là chữ vẫn hiện rõ ở mọi lần
       chuyển màn dù đã ghi opacity:0 ngay bên cạnh. */
    #veil .mark{
      font:700 34px system-ui,sans-serif;color:#3B2A4A;letter-spacing:-.01em;
      text-align:center;line-height:.98;opacity:0;
    }
    #veil.boot .mark{opacity:.92;animation:bootPulse 1.5s ease-in-out infinite alternate}
    #veil .mark em{font-style:normal;color:#E2637F;display:block}
    @keyframes bootPulse{from{opacity:.55;transform:scale(.99)}to{opacity:.95;transform:none}}
    @media (prefers-reduced-motion: reduce){
      #veil .mark{animation:none}
      #veil,#veil.off{transition:none}
    }
  </style>
</head>
<body>
  <div id="veil" class="boot"><div class="mark">Everything<em>Fits</em></div></div>
  <div id="phone">
    <canvas id="game"></canvas>

    <!-- Thanh trên: tên level bên trái, nút tạm dừng bên phải -->
    <div class="hud top">
      <div class="titleblock">
        <div class="eyebrow" id="eyebrow">LEVEL 1</div>
        <div class="title" id="title">Sunny escape</div>
      </div>
      <button class="pause" id="pauseBtn" data-art-icon="pause" data-i18n-aria="pauseAria" aria-label="Pause">
        <svg viewBox="0 0 24 24"><rect x="7" y="5.4" width="3.6" height="13.2" rx="1.7"/><rect x="13.4" y="5.4" width="3.6" height="13.2" rx="1.7"/></svg>
      </button>
    </div>

    <!-- Đồng hồ + số món còn lại: đặt cạnh nhau ở vùng luôn trống, không bao giờ đè lên túi -->
    <div class="hud timerwrap">
      <div class="timer" id="clock" data-art-icon="timer">1:30</div>
      <div class="counter"><b id="count">0</b><span data-i18n="itemsLeft">items<br>left</span></div>
    </div>

    <!-- Toast -->
    <div class="hint hide" id="hint"></div>

    <!-- Booster: mỗi nút một màu và một icon đặc, nhìn là hiểu -->
    <div class="hud dock">
      <button class="boost b-freeze" id="bFreeze" data-art-icon="snow">
        <span class="ic">
          <svg viewBox="0 0 40 40">
            <!-- bông tuyết: đồ trong túi đứng yên -->
            <g stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none">
              <path d="M20 5v30M7 12.5l26 15M7 27.5l26-15"/>
              <path d="M15.5 7.5 20 11l4.5-3.5M15.5 32.5 20 29l4.5 3.5M6.2 18.2l5.4 1.8L10 25M33.8 18.2 28.4 20 30 25M9.4 8.9l2 5.3-5.6 1.1M30.6 8.9l-2 5.3 5.6 1.1" stroke-width="2.2"/>
            </g>
          </svg>
        </span>
        <span class="nm" data-i18n="boostFreeze">Freeze</span><b class="badge">2</b>
      </button>

      <button class="boost b-resize" id="bResize" data-art-icon="small">
        <span class="ic">
          <svg viewBox="0 0 40 40">
            <!-- món to thu lại thành món nhỏ -->
            <rect x="6.5" y="6.5" width="27" height="27" rx="4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="4 3.4" opacity=".75"/>
            <rect x="14" y="14" width="12" height="12" rx="2.6" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M10 10.5 13.4 14M13.4 10.5H10v3.4"/>
              <path d="M30 29.5 26.6 26M26.6 29.5H30v-3.4"/>
            </g>
          </svg>
        </span>
        <span class="nm" data-i18n="boostResize">Shrink</span><b class="badge">2</b>
      </button>

      <button class="boost b-throw" id="bThrow" data-art-icon="delete">
        <span class="ic">
          <svg viewBox="0 0 40 40">
            <!-- món đồ đang rơi vào thùng rác -->
            <rect x="14.5" y="3" width="11" height="8" rx="2" fill="currentColor" opacity=".55" transform="rotate(18 20 7)"/>
            <path d="M9 14h22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M16 14v-2h8v2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M11.6 17h16.8l-1.5 16a2 2 0 0 1-2 1.8H15.1a2 2 0 0 1-2-1.8z" fill="currentColor"/>
            <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8">
              <path d="M17 21.5v8M23 21.5v8"/>
            </g>
          </svg>
        </span>
        <span class="nm" data-i18n="boostThrow">Throw out</span><b class="badge">1</b>
      </button>
    </div>

    <!-- ================= Splash: đồ rơi thành đống, logo, tự sang trang chủ ================= -->
    <div class="screen splash" id="splash" data-art-icon="paper">
      <canvas id="splashCv"></canvas>
      <div class="splash-brand">
        <div class="brand-sub">SmartMove · Inno Team</div>
        <h1 class="brand-name">Everything<br><em>Fits</em></h1>
        <p class="splash-tag" data-i18n="splashTag">Pack it all in!</p>
      </div>
      <div class="splash-bar"><i></i></div>
    </div>

    <!-- ================= Màn chủ ================= -->
    <div class="screen home" id="home" data-art-icon="paper">
      <div class="home-glow"></div>
      <div class="home-inner">
        <div class="brand">
          <div class="brand-sub">SmartMove · Inno Team</div>
          <h1 class="brand-name">Everything<br><em>Fits</em></h1>
        </div>

        <!-- Đang ở chương nào, đã qua bao nhiêu màn, màn tiếp theo là màn mấy -->
        <div class="chcard" id="homeChapter">
          <div class="chcard-bg" id="homeBg"></div>
          <div class="chcard-art"><img id="homeArt" alt="" draggable="false"><img id="homeArt2" alt="" draggable="false"></div>
          <div class="chcard-no" id="homeNo">CHAPTER 1</div>
          <div class="chcard-name" id="homeName">—</div>
          <div class="bar"><i id="homeBar"></i></div>
          <div class="chcard-foot">
            <span id="homeCount">0/0 levels</span>
            <span class="pill" id="homeNext">LEVEL 1</span>
          </div>
        </div>

        <div class="home-actions">
          <button class="cta wide ghost" id="mapBtn">
            <svg viewBox="0 0 24 24" class="bic"><rect x="3" y="3" width="7.4" height="7.4" rx="2"/><rect x="13.6" y="3" width="7.4" height="7.4" rx="2"/><rect x="3" y="13.6" width="7.4" height="7.4" rx="2"/><rect x="13.6" y="13.6" width="7.4" height="7.4" rx="2"/></svg>
            <span data-i18n="pickLevel">Choose a level</span>
          </button>
          <button class="cta wide play" id="playBtn">
            <svg viewBox="0 0 24 24" class="bic"><path d="M7 4.6v14.8a1 1 0 0 0 1.53.85l11.2-7.4a1 1 0 0 0 0-1.7L8.53 3.75A1 1 0 0 0 7 4.6z"/></svg>
            <span id="playLabel">Play</span>
          </button>
        </div>
      </div>

      <div class="home-tools">
        <button class="iconbtn lang" id="langBtn" data-i18n-aria="langAria" aria-label="Language">EN</button>
        <button class="iconbtn" id="sfxBtn" data-i18n-aria="sfxAria" aria-label="Toggle sound"></button>
        <button class="iconbtn" id="musicBtn" data-i18n-aria="musicAria" aria-label="Toggle music"></button>
      </div>
    </div>

    <!-- ================= Bản đồ chương & màn ================= -->
    <div class="screen mapscr" id="mapscr" data-art-icon="paper">
      <header class="mhead">
        <button class="iconbtn" id="mapBack" data-i18n-aria="backAria" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <b data-i18n="pickLevel">Choose a level</b>
      </header>
      <div class="mlist" id="mapList"></div>
    </div>

    <!-- Pause menu -->
    <div class="overlay" id="pause">
      <div class="card">
        <h2 data-i18n="paused">Paused</h2>
        <div class="actions col">
          <button class="cta" id="resumeBtn" data-i18n="resumeBtn">Resume</button>
          <button class="cta ghost" id="restartBtn" data-i18n="restart">Restart</button>
          <button class="cta ghost" id="homeBtn" data-i18n="home">Home</button>
          <div class="lvnav"><button id="prevLv" data-i18n="prevLevel">‹ Previous</button><button id="nextLv" data-i18n="nextLevel">Next ›</button></div>
        </div>
      </div>
    </div>

    <!-- Win -->
    <div class="overlay" id="win">
      <div class="card">
        <div class="stars" id="winStars"></div>
        <h2 id="winRank">It fits!</h2>
        <p id="winText"></p>
        <div class="score" id="winScore"></div>
        <div class="actions"><button class="cta ghost" id="again" data-i18n="winReplay">Replay</button><button class="cta" id="next" data-i18n="winNext">Next level →</button></div>
        <button class="linkbtn" id="winHome" data-i18n="home">Home</button>
      </div>
    </div>

    <!-- Lose -->
    <div class="overlay" id="lose">
      <div class="card">
        <div class="clockicon"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></div>
        <h2 data-i18n="soClose">So close!</h2>
        <p id="loseText">Time's up.</p>
        <div class="actions"><button class="cta ghost" id="retry" data-i18n="tryAgain">Try again</button><button class="cta" id="extraTime" data-i18n="extraTime">+60 sec · 100 coins</button></div>
        <button class="linkbtn" id="loseHome" data-i18n="home">Home</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
